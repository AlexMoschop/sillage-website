  <!-- ============================================================
       REDIRECT STUB. /home exists so the address works if anyone types or links it. The
       homepage's real address is the bare domain, which is where a homepage
       belongs, so this sends visitors there rather than serving a duplicate.

       GitHub Pages cannot serve a real 301, so this is the standard static
       equivalent: a canonical tag pointing at the live address, which is what
       search engines consolidate on, a meta refresh, and a plain link for
       anyone with JavaScript and refresh both disabled.
       ============================================================ -->

  <meta name="robots" content="noindex,follow" />
  <meta http-equiv="refresh" content="0; url=../" />

  <link rel="stylesheet" href="../styles.css?v=8.5" />
</head>

      </p>
    </div>

</body>
