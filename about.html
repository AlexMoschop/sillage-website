<!doctype html>
<html lang="en">

  <!-- ============================================================
       REDIRECT STUB. The About page lost its .html on 2026-08-02 and now lives at
       /about/. This keeps every inbound link to /about.html working.

       GitHub Pages cannot serve a real 301, so this is the standard static
       equivalent: a canonical tag pointing at the live address, which is what
       search engines consolidate on, a meta refresh, and a plain link for
       anyone with JavaScript and refresh both disabled.
       ============================================================ -->

  <meta name="robots" content="noindex,follow" />
  <meta http-equiv="refresh" content="0; url=about/" />
  <title>About, moved &middot; Sillage</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=8.5" />
</head>

        <a class="btn btn--solid" href="about/">Go to About</a>
      </p>

  <script>window.location.replace("about/");</script>
</body>
</html>
